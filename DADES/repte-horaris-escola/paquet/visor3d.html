<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Visor 3D Aules UAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #636e72;
        }
        #ui { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 15px 35px; border-radius: 12px; display: flex; gap: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .control { display: flex; flex-direction: column; gap: 8px; font-weight: 700; color: #2d3436; }
        select, input[type=range] { cursor: pointer; }
        select { padding: 5px; border-radius: 5px; border: 1px solid #b2bec3; font-family: 'Nunito', sans-serif; font-weight: 700; }
        #legend { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.95); padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); color: #2d3436; font-weight: 700; }
        .leg-item { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 15px; }
        .leg-item:last-child { margin-bottom: 0; }
        .box { width: 18px; height: 18px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(45, 52, 54, 0.9); color: white; padding: 15px 20px; border-radius: 12px; pointer-events: none; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 15px; line-height: 1.5; }
        #info strong { color: #74b9ff; font-size: 18px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="legend">
        <div class="leg-item"><div class="box" style="background: #dfe6e9;"></div>Lliure</div>
        <div class="leg-item"><div class="box" style="background: #00b894;"></div>Ocupada</div>
        <div class="leg-item"><div class="box" style="background: #d63031;"></div>Excés d'Aforament</div>
    </div>
    <div id="info"></div>
    <div id="ui">
        <div class="control">
            <label>Dia:</label>
            <select id="dia">
                <option value="L">Dilluns</option><option value="M">Dimarts</option>
                <option value="X">Dimecres</option><option value="J">Dijous</option>
                <option value="V">Divendres</option>
            </select>
        </div>
        <div class="control">
            <label>Hora: <span id="hora-txt">08:00</span></label>
            <input type="range" id="hora" min="8" max="20" step="1" value="8" style="width: 200px;">
        </div>
    </div>
    <script>
        let layout = [];
        let ocupacio = {};
        const rooms = {};

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 180);

        const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(50, 120, 80);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const geo = new THREE.BoxGeometry(14, 10, 14);
        const terra = new THREE.Mesh(
            new THREE.PlaneGeometry(350, 300), 
            new THREE.MeshLambertMaterial({color: 0x95a5a6})
        );
        terra.rotation.x = -Math.PI / 2;
        terra.position.y = -5;
        terra.receiveShadow = true;
        scene.add(terra);

        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 128;
            context.font = "bold 32px 'Nunito', 'Segoe UI', Tahoma, sans-serif";
            context.shadowColor = "rgba(255, 255, 255, 0.9)";
            context.shadowBlur = 6;
            context.fillStyle = "rgba(45, 52, 54, 1.0)";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillText(message, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(16, 8, 1);
            return sprite;
        }

        function inicialitzarLayout(dataLayout) {
            layout = dataLayout;
            layout.forEach(aula => {
                const mat = new THREE.MeshLambertMaterial({color: 0xdfe6e9});
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(aula.x, aula.y, aula.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = aula;
                scene.add(mesh);
                rooms[aula.id] = mesh;
                
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0xb2bec3, linewidth: 2}));
                mesh.add(line);
                
                const textSprite = createTextSprite(aula.id);
                textSprite.position.y = 9;
                mesh.add(textSprite);
            });
        }

        function actualitzar() {
            const dia = document.getElementById('dia').value;
            const horaVal = document.getElementById('hora').value;
            const horaStr = horaVal.padStart(2, '0') + ':00';
            document.getElementById('hora-txt').textContent = horaStr;
            
            const dadesHora = (ocupacio[dia] && ocupacio[dia][horaStr]) ? ocupacio[dia][horaStr] : {};
            
            Object.keys(rooms).forEach(id => {
                const estat = dadesHora[id] || 0;
                let color = 0xdfe6e9;
                if (estat === 1) color = 0x00b894;
                if (estat === 2) color = 0xd63031;
                rooms[id].material.color.setHex(color);
            });
        }

        document.getElementById('dia').addEventListener('change', actualitzar);
        document.getElementById('hora').addEventListener('input', actualitzar);

        Promise.all([
            fetch('layout.json').then(r => r.json()),
            fetch('ocupacio.json').then(r => r.json())
        ]).then(([layoutData, ocupacioData]) => {
            ocupacio = ocupacioData;
            inicialitzarLayout(layoutData);
            actualitzar();
        }).catch(err => console.error("Error carregant dades JSON. Comprova el servidor local.", err));

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoBox = document.getElementById('info');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Object.values(rooms));
            
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                infoBox.style.display = 'block';
                infoBox.innerHTML = `<strong>${data.id}</strong><br>${data.desc}<br>Capacitat: ${data.capacitat}`;
            } else {
                infoBox.style.display = 'none';
            }
        });

        function anim() {
            requestAnimationFrame(anim);
            controls.update();
            renderer.render(scene, camera);
        }
        anim();
    </script>
</body>
</html>
